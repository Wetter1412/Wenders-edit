name: Build W edit v0.1 APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Tải mã nguồn (Bản v6 chuẩn Node.js 24)
        uses: actions/checkout@v6

      - name: 2. Cài đặt Node.js 24 (Bản v6 không cảnh báo)
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 3. Cài đặt Java JDK 17 (Bản v5)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Kiểm tra và tự động tạo bù các file nếu bị thiếu (Chống lỗi 254)
        run: |
          # Nếu người dùng lỡ đặt file trong thư mục con w-edit/, tự động đưa ra ngoài cùng
          if [ -f "w-edit/package.json" ] && [ ! -f "package.json" ]; then
            cp -rn w-edit/* .
          fi

          mkdir -p src src-tauri/src src-tauri/capabilities src-tauri/icons

          # 1. Tự tạo package.json nếu chưa có
          if [ ! -f "package.json" ]; then
            cat << 'EOF' > package.json
          {
            "name": "w-edit-ui",
            "private": true,
            "version": "0.1.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "tsc && vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "@codemirror/autocomplete": "^6.18.0",
              "@codemirror/commands": "^6.6.0",
              "@codemirror/lang-cpp": "^6.0.2",
              "@codemirror/lang-css": "^6.2.1",
              "@codemirror/lang-html": "^6.4.9",
              "@codemirror/lang-javascript": "^6.2.2",
              "@codemirror/lang-json": "^6.0.1",
              "@codemirror/lang-markdown": "^6.2.5",
              "@codemirror/lang-python": "^6.1.6",
              "@codemirror/lang-rust": "^6.0.1",
              "@codemirror/language": "^6.10.2",
              "@codemirror/state": "^6.4.1",
              "@codemirror/theme-one-dark": "^6.1.2",
              "@codemirror/view": "^6.28.4",
              "@tauri-apps/api": "^2.0.0",
              "@tauri-apps/plugin-dialog": "^2.0.0",
              "@tauri-apps/plugin-fs": "^2.0.0",
              "@tauri-apps/plugin-shell": "^2.0.0",
              "codemirror": "^6.0.1"
            },
            "devDependencies": {
              "@tauri-apps/cli": "^2.0.0",
              "typescript": "^5.5.3",
              "vite": "^5.3.4"
            }
          }
          EOF
          fi

          # 2. Tự tạo tsconfig.json nếu chưa có
          if [ ! -f "tsconfig.json" ]; then
            cat << 'EOF' > tsconfig.json
          {
            "compilerOptions": {
              "target": "ES2020",
              "useDefineForClassFields": true,
              "module": "ESNext",
              "lib": ["ES2020", "DOM", "DOM.Iterable"],
              "skipLibCheck": true,
              "moduleResolution": "bundler",
              "allowImportingTsExtensions": true,
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "strict": true
            },
            "include": ["src"]
          }
          EOF
          fi

          # 3. Tự tạo vite.config.ts nếu chưa có
          if [ ! -f "vite.config.ts" ]; then
            cat << 'EOF' > vite.config.ts
          import { defineConfig } from "vite";
          export default defineConfig({
            clearScreen: false,
            server: { port: 1420, strictPort: true },
            envPrefix: ["VITE_", "TAURI_"],
            build: { target: "es2021", minify: "esbuild", sourcemap: false }
          });
          EOF
          fi

          # 4. Tự tạo index.html nếu chưa có
          if [ ! -f "index.html" ]; then
            cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <title>W edit v0.1</title>
            <link rel="stylesheet" href="/src/styles.css" />
          </head>
          <body>
            <header class="app-toolbar">
              <div class="brand">W edit <span class="ver-badge">v0.1</span></div>
              <div class="toolbar-actions">
                <button id="btn-new">＋</button>
                <button id="btn-open">📂</button>
                <button id="btn-save">💾</button>
                <button id="btn-undo">↩</button>
                <button id="btn-redo">↪</button>
                <button id="btn-search-toggle">🔍</button>
                <button id="btn-gdrive">☁️</button>
                <button id="btn-appearance">🎨</button>
              </div>
            </header>
            <nav id="tab-bar" class="tab-bar"></nav>
            <section id="search-panel" class="search-panel hidden">
              <div class="search-row">
                <input type="text" id="search-input" placeholder="Tìm kiếm (Regex)..." />
                <label class="chip"><input type="checkbox" id="chk-case" /> Aa</label>
                <label class="chip"><input type="checkbox" id="chk-regex" /> .*</label>
                <button id="btn-find">Tìm</button>
              </div>
              <div class="search-row">
                <input type="text" id="replace-input" placeholder="Thay thế bằng..." />
                <button id="btn-replace-all">Thay tất cả</button>
                <span id="search-summary">0 kết quả</span>
              </div>
            </section>
            <main id="editor-host" class="editor-host"></main>
            <section id="accessory-bar" class="accessory-bar">
              <button data-insert="    ">Tab</button>
              <button data-insert="{">{</button>
              <button data-insert="}">}</button>
              <button data-insert="(">(</button>
              <button data-insert=")">)</button>
              <button data-insert="[">[</button>
              <button data-insert="]">]</button>
              <button data-insert=";">;</button>
              <button data-insert="=">=</button>
              <button data-insert="&quot;">"</button>
              <button data-insert="'">'</button>
              <button data-insert="&lt;">&lt;</button>
              <button data-insert="&gt;">&gt;</button>
              <button data-insert="/">/</button>
            </section>
            <footer class="status-bar">
              <span id="stat-cursor">Dòng 1, Cột 1</span>
              <span id="stat-lines">1 dòng | 0 B</span>
              <span id="stat-encoding">UTF-8</span>
              <span id="stat-sync">📱 Local</span>
            </footer>
            <div id="appearance-modal" class="modal hidden">
              <div class="modal-card">
                <div class="modal-header">
                  <h3>🎨 Giao diện RGB & Phông chữ (W edit v0.1)</h3>
                  <button id="btn-close-appearance">✕</button>
                </div>
                <div class="modal-body">
                  <div class="settings-group">
                    <h4>1. Phông chữ & Kích thước</h4>
                    <div class="setting-row">
                      <select id="select-font-family">
                        <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
                        <option value="'Fira Code', monospace">Fira Code</option>
                        <option value="monospace">Monospace</option>
                      </select>
                      <button id="btn-import-font">➕ Thêm Font (.ttf/.otf)</button>
                    </div>
                    <div class="setting-row">
                      <label>Cỡ chữ: <strong id="lbl-font-size">14px</strong></label>
                      <input type="range" id="slider-font-size" min="10" max="32" value="14" />
                    </div>
                  </div>
                  <div class="settings-group">
                    <h4>2. Bảng màu RGB tự do</h4>
                    <div class="setting-row">
                      <select id="select-color-target">
                        <option value="--bg-primary">Nền Trình soạn thảo</option>
                        <option value="--bg-secondary">Nền Thanh công cụ & Tab</option>
                        <option value="--bg-surface">Nền Nút bấm</option>
                        <option value="--text-main">Màu Chữ chính</option>
                        <option value="--accent">Màu Nhấn</option>
                        <option value="--border">Màu Đường viền</option>
                      </select>
                    </div>
                    <div class="rgb-mixer">
                      <div class="rgb-slider-row">
                        <span class="rgb-tag r-tag">R</span>
                        <input type="range" id="rgb-r" min="0" max="255" value="30" />
                        <input type="number" id="num-r" min="0" max="255" value="30" />
                      </div>
                      <div class="rgb-slider-row">
                        <span class="rgb-tag g-tag">G</span>
                        <input type="range" id="rgb-g" min="0" max="255" value="30" />
                        <input type="number" id="num-g" min="0" max="255" value="30" />
                      </div>
                      <div class="rgb-slider-row">
                        <span class="rgb-tag b-tag">B</span>
                        <input type="range" id="rgb-b" min="0" max="255" value="46" />
                        <input type="number" id="num-b" min="0" max="255" value="46" />
                      </div>
                      <div class="rgb-preview-row">
                        <input type="color" id="native-color-picker" value="#1e1e2e" />
                        <code id="hex-output">#1E1E2E</code>
                      </div>
                    </div>
                    <div class="preset-row">
                      <button id="btn-preset-dark">🌙 Dark</button>
                      <button id="btn-preset-light">☀️ Light</button>
                      <button id="btn-preset-amoled">🖤 AMOLED</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div id="gdrive-modal" class="modal hidden">
              <div class="modal-card">
                <div class="modal-header">
                  <h3>☁️ Liên kết Google Drive</h3>
                  <button id="btn-close-modal">✕</button>
                </div>
                <div class="modal-body">
                  <button id="btn-gdrive-login">1. Lấy link Đăng nhập Google</button>
                  <div class="code-verify-row">
                    <input type="text" id="gdrive-code-input" placeholder="Dán mã Auth Code..." />
                    <button id="btn-gdrive-verify">2. Xác nhận</button>
                  </div>
                  <div class="drive-actions">
                    <button id="btn-gdrive-refresh">🔄 Tải danh sách file</button>
                    <button id="btn-gdrive-upload">⬆️ Lưu lên Drive</button>
                  </div>
                  <ul id="gdrive-file-list" class="file-list"></ul>
                </div>
              </div>
            </div>
            <script type="module" src="/src/main.ts"></script>
          </body>
          </html>
          EOF
          fi

          # 5. Tự tạo src/styles.css nếu chưa có
          if [ ! -f "src/styles.css" ]; then
            cat << 'EOF' > src/styles.css
          :root {
            --bg-primary: #1e1e2e;
            --bg-secondary: #181825;
            --bg-surface: #313244;
            --text-main: #cdd6f4;
            --text-muted: #a6adc8;
            --accent: #89b4fa;
            --border: #45475a;
            --editor-font: 'JetBrains Mono', monospace;
            --editor-font-size: 14px;
          }
          * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
          body { font-family: system-ui, sans-serif; background: var(--bg-primary); color: var(--text-main); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
          .hidden { display: none !important; }
          .app-toolbar, .status-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-secondary); padding: 6px 10px; border-bottom: 1px solid var(--border); }
          .brand { font-weight: 800; color: var(--accent); display: flex; gap: 6px; align-items: center; }
          .ver-badge { font-size: 11px; background: var(--bg-surface); padding: 2px 6px; border-radius: 4px; color: var(--text-main); }
          .toolbar-actions, .search-row, .setting-row, .rgb-slider-row, .preset-row, .code-verify-row, .drive-actions { display: flex; gap: 6px; align-items: center; }
          button, select, input { background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 13px; }
          .tab-bar, .accessory-bar { display: flex; overflow-x: auto; background: var(--bg-secondary); border-bottom: 1px solid var(--border); }
          .tab-item { padding: 8px 14px; font-size: 13px; color: var(--text-muted); border-right: 1px solid var(--border); white-space: nowrap; display: flex; gap: 8px; cursor: pointer; }
          .tab-item.active { background: var(--bg-primary); color: var(--accent); border-bottom: 2px solid var(--accent); font-weight: 600; }
          .editor-host { flex: 1; overflow: hidden; }
          .cm-editor { height: 100%; background: var(--bg-primary) !important; color: var(--text-main) !important; }
          .cm-editor .cm-scroller { font-family: var(--editor-font) !important; font-size: var(--editor-font-size) !important; }
          .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 14px; }
          .modal-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; width: 100%; max-width: 480px; max-height: 85vh; display: flex; flex-direction: column; }
          .modal-header { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border); }
          .modal-body { padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
          .settings-group, .rgb-mixer { border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
          .file-list { list-style: none; max-height: 180px; overflow-y: auto; }
          .file-list li { padding: 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
          EOF
          fi

          # 6. Tự tạo src/main.ts nếu chưa có
          if [ ! -f "src/main.ts" ]; then
            cat << 'EOF' > src/main.ts
          import { invoke } from "@tauri-apps/api/core";
          import { open, save } from "@tauri-apps/plugin-dialog";
          import { open as openBrowser } from "@tauri-apps/plugin-shell";
          import { EditorState, Compartment } from "@codemirror/state";
          import { EditorView, lineNumbers, highlightActiveLine, keymap } from "@codemirror/view";
          import { defaultKeymap, indentWithTab } from "@codemirror/commands";
          import { bracketMatching, foldGutter } from "@codemirror/language";
          import { closeBrackets } from "@codemirror/autocomplete";
          import { oneDark } from "@codemirror/theme-one-dark";
          import { rust } from "@codemirror/lang-rust";
          import { javascript } from "@codemirror/lang-javascript";
          import { python } from "@codemirror/lang-python";
          import { html } from "@codemirror/lang-html";
          import { css } from "@codemirror/lang-css";
          import { json } from "@codemirror/lang-json";
          import { markdown } from "@codemirror/lang-markdown";
          import { cpp } from "@codemirror/lang-cpp";

          let activeTabId = "";
          let activeMeta: any = null;
          let isInternalChange = false;
          let debounceTimer: number | undefined;
          const languageCompartment = new Compartment();
          let editorView: EditorView;

          const DEFAULT_DARK_COLORS: Record<string, string> = {
            "--bg-primary": "#1e1e2e",
            "--bg-secondary": "#181825",
            "--bg-surface": "#313244",
            "--text-main": "#cdd6f4",
            "--accent": "#89b4fa",
            "--border": "#45475a",
          };
          let currentCustomColors: Record<string, string> = { ...DEFAULT_DARK_COLORS };

          function detectLanguageExtension(filename: string) {
            const ext = filename.split(".").pop()?.toLowerCase();
            switch (ext) {
              case "rs": return rust();
              case "js": case "ts": return javascript({ typescript: true });
              case "py": return python();
              case "html": return html();
              case "css": return css();
              case "json": return json();
              case "c": case "cpp": return cpp();
              default: return markdown();
            }
          }

          function initEditor() {
            const host = document.getElementById("editor-host")!;
            const state = EditorState.create({
              doc: "",
              extensions: [
                lineNumbers(), highlightActiveLine(), foldGutter(), bracketMatching(), closeBrackets(),
                EditorView.lineWrapping, oneDark, languageCompartment.of(markdown()),
                keymap.of([...defaultKeymap, indentWithTab]),
                EditorView.updateListener.of((update) => {
                  if (update.selectionSet) {
                    const pos = editorView.state.selection.main.head;
                    const line = editorView.state.doc.lineAt(pos);
                    document.getElementById("stat-cursor")!.textContent = `Dòng ${line.number}, Cột ${pos - line.from + 1}`;
                  }
                  if (update.docChanged && !isInternalChange && activeTabId) {
                    clearTimeout(debounceTimer);
                    debounceTimer = window.setTimeout(async () => {
                      const meta = await invoke<any>("update_buffer", { tabId: activeTabId, content: editorView.state.doc.toString() });
                      updateStatusBar(meta);
                      await refreshTabBar();
                    }, 250);
                  }
                }),
              ],
            });
            editorView = new EditorView({ state, parent: host });
          }

          function setEditorText(content: string, filename: string) {
            isInternalChange = true;
            editorView.dispatch({
              changes: { from: 0, to: editorView.state.doc.length, insert: content },
              effects: languageCompartment.reconfigure(detectLanguageExtension(filename)),
            });
            isInternalChange = false;
          }

          function updateStatusBar(meta: any) {
            activeMeta = meta;
            document.getElementById("stat-lines")!.textContent = `${meta.total_lines} dòng | ${meta.total_bytes} B`;
            document.getElementById("stat-encoding")!.textContent = meta.encoding;
            document.getElementById("stat-sync")!.textContent = meta.gdrive_file_id ? "☁️ Drive" : "📱 Local";
          }

          async function refreshTabBar() {
            const tabs = await invoke<any[]>("get_all_tabs");
            const tabBar = document.getElementById("tab-bar")!;
            tabBar.innerHTML = "";
            tabs.forEach((tab) => {
              const item = document.createElement("div");
              item.className = `tab-item ${tab.id === activeTabId ? "active" : ""}`;
              item.innerHTML = `<span>${tab.is_modified ? "● " : ""}${tab.title}</span>`;
              const closeBtn = document.createElement("span");
              closeBtn.textContent = "✕";
              closeBtn.onclick = async (e) => {
                e.stopPropagation();
                const nextId = await invoke<string | null>("close_tab", { tabId: tab.id });
                if (nextId) await switchToTab(nextId);
              };
              item.onclick = () => switchToTab(tab.id);
              item.appendChild(closeBtn);
              tabBar.appendChild(item);
            });
          }

          async function switchToTab(tabId: string) {
            const res = await invoke<any>("switch_tab", { tabId });
            activeTabId = res.metadata.id;
            setEditorText(res.content, res.metadata.title);
            updateStatusBar(res.metadata);
            await refreshTabBar();
          }

          function applyAllColorsToDOM() {
            for (const [k, v] of Object.entries(currentCustomColors)) {
              document.documentElement.style.setProperty(k, v);
            }
          }

          window.addEventListener("DOMContentLoaded", async () => {
            initEditor();
            applyAllColorsToDOM();
            const tabs = await invoke<any[]>("get_all_tabs");
            if (tabs.length > 0) await switchToTab(tabs[0].id);

            document.getElementById("btn-new")!.onclick = async () => {
              const res = await invoke<any>("create_new_tab", { title: null });
              activeTabId = res.metadata.id;
              setEditorText(res.content, res.metadata.title);
              updateStatusBar(res.metadata);
              await refreshTabBar();
            };
            document.getElementById("btn-open")!.onclick = async () => {
              const selected = await open({ multiple: false });
              if (typeof selected === "string") {
                const res = await invoke<any>("open_local_file", { path: selected });
                activeTabId = res.metadata.id;
                setEditorText(res.content, res.metadata.title);
                updateStatusBar(res.metadata);
                await refreshTabBar();
              }
            };
            document.getElementById("btn-save")!.onclick = async () => {
              if (!activeMeta) return;
              const targetPath = activeMeta.file_path || (await save({ defaultPath: activeMeta.title }));
              if (targetPath) {
                const meta = await invoke<any>("save_local_file", { tabId: activeTabId, path: targetPath });
                updateStatusBar(meta);
                await refreshTabBar();
              }
            };
            document.getElementById("btn-undo")!.onclick = async () => {
              try {
                const res = await invoke<any>("undo_action", { tabId: activeTabId });
                setEditorText(res.content, res.metadata.title);
                updateStatusBar(res.metadata);
              } catch (_) {}
            };
            document.getElementById("btn-redo")!.onclick = async () => {
              try {
                const res = await invoke<any>("redo_action", { tabId: activeTabId });
                setEditorText(res.content, res.metadata.title);
                updateStatusBar(res.metadata);
              } catch (_) {}
            };
            document.getElementById("btn-search-toggle")!.onclick = () => document.getElementById("search-panel")!.classList.toggle("hidden");
            document.getElementById("btn-appearance")!.onclick = () => document.getElementById("appearance-modal")!.classList.remove("hidden");
            document.getElementById("btn-close-appearance")!.onclick = () => document.getElementById("appearance-modal")!.classList.add("hidden");
            document.getElementById("btn-gdrive")!.onclick = () => document.getElementById("gdrive-modal")!.classList.remove("hidden");
            document.getElementById("btn-close-modal")!.onclick = () => document.getElementById("gdrive-modal")!.classList.add("hidden");

            const targetSelect = document.getElementById("select-color-target") as HTMLSelectElement;
            const rSlider = document.getElementById("rgb-r") as HTMLInputElement;
            const gSlider = document.getElementById("rgb-g") as HTMLInputElement;
            const bSlider = document.getElementById("rgb-b") as HTMLInputElement;
            const rNum = document.getElementById("num-r") as HTMLInputElement;
            const gNum = document.getElementById("num-g") as HTMLInputElement;
            const bNum = document.getElementById("num-b") as HTMLInputElement;
            const colorWheel = document.getElementById("native-color-picker") as HTMLInputElement;
            const hexOutput = document.getElementById("hex-output")!;

            function updateRgb() {
              const r = parseInt(rSlider.value, 10) || 0;
              const g = parseInt(gSlider.value, 10) || 0;
              const b = parseInt(bSlider.value, 10) || 0;
              rNum.value = String(r); gNum.value = String(g); bNum.value = String(b);
              const hex = "#" + [r, g, b].map(x => x.toString(16).padStart(2, "0")).join("");
              colorWheel.value = hex;
              hexOutput.textContent = hex.toUpperCase();
              currentCustomColors[targetSelect.value] = hex;
              applyAllColorsToDOM();
            }
            [rSlider, gSlider, bSlider].forEach(el => el.oninput = updateRgb);
            colorWheel.oninput = () => {
              const n = parseInt(colorWheel.value.slice(1), 16);
              rSlider.value = String((n >> 16) & 255);
              gSlider.value = String((n >> 8) & 255);
              bSlider.value = String(n & 255);
              updateRgb();
            };

            document.getElementById("btn-import-font")!.onclick = async () => {
              const selected = await open({ multiple: false, filters: [{ name: "Fonts", extensions: ["ttf", "otf", "woff", "woff2"] }] });
              if (typeof selected === "string") {
                const fontData = await invoke<any>("load_custom_font", { path: selected });
                const face = new FontFace(fontData.font_family, `url(${fontData.data_url})`);
                await face.load();
                document.fonts.add(face);
                document.documentElement.style.setProperty("--editor-font", `'${fontData.font_family}', monospace`);
              }
            };
          });
          EOF
          fi

          # 7. Tự tạo src-tauri/Cargo.toml nếu chưa có
          if [ ! -f "src-tauri/Cargo.toml" ]; then
            cat << 'EOF' > src-tauri/Cargo.toml
          [package]
