          pub mod editor;
          pub mod gdrive;

          use base64::{engine::general_purpose::STANDARD as BASE64_STANDARD, Engine as _};
          use editor::{DocumentMetadata, DocumentSession, EditorManager, SearchMatch};
          use gdrive::{GDriveFile, GoogleDriveClient, OAuthToken};
          use serde::Serialize;
          use std::path::Path;
          use tauri::State;
          use tokio::sync::Mutex;

          pub struct AppState {
              pub editor: Mutex<EditorManager>,
              pub gdrive: Mutex<GoogleDriveClient>,
          }

          #[derive(Serialize)]
          pub struct TabContentResponse { pub metadata: DocumentMetadata, pub content: String }

          #[derive(Serialize)]
          pub struct ReplaceResponse { pub metadata: DocumentMetadata, pub content: String, pub replaced_count: usize }

          #[derive(Serialize)]
          pub struct CustomFontData { pub font_family: String, pub data_url: String }

          #[tauri::command]
          async fn create_new_tab(title: Option<String>, state: State<'_, AppState>) -> Result<TabContentResponse, String> {
              let mut editor = state.editor.lock().await;
              let t = title.unwrap_or_else(|| format!("Untitled-{}.txt", editor.sessions.len() + 1));
              let doc = DocumentSession::new_empty(&t);
              let meta = doc.metadata.clone();
              editor.sessions.insert(meta.id.clone(), doc);
              editor.active_tab_id = Some(meta.id.clone());
              Ok(TabContentResponse { metadata: meta, content: String::new() })
          }

          #[tauri::command]
          async fn get_all_tabs(state: State<'_, AppState>) -> Result<Vec<DocumentMetadata>, String> {
              let editor = state.editor.lock().await;
              Ok(editor.sessions.values().map(|s| s.metadata.clone()).collect())
          }

          #[tauri::command]
          async fn switch_tab(tab_id: String, state: State<'_, AppState>) -> Result<TabContentResponse, String> {
              let mut editor = state.editor.lock().await;
              let s = editor.sessions.get(&tab_id).ok_or("Not found")?;
              let resp = TabContentResponse { metadata: s.metadata.clone(), content: s.rope.to_string() };
              editor.active_tab_id = Some(tab_id);
              Ok(resp)
          }

          #[tauri::command]
          async fn close_tab(tab_id: String, state: State<'_, AppState>) -> Result<Option<String>, String> {
              let mut editor = state.editor.lock().await;
              editor.sessions.remove(&tab_id);
              if editor.sessions.is_empty() {
                  let doc = DocumentSession::new_empty("Untitled-1.txt");
                  let id = doc.metadata.id.clone();
                  editor.sessions.insert(id.clone(), doc);
                  editor.active_tab_id = Some(id);
              } else if editor.active_tab_id.as_deref() == Some(&tab_id) {
                  editor.active_tab_id = editor.sessions.keys().next().cloned();
              }
              Ok(editor.active_tab_id.clone())
          }

          #[tauri::command]
          async fn open_local_file(path: String, state: State<'_, AppState>) -> Result<TabContentResponse, String> {
              let mut editor = state.editor.lock().await;
              let (metadata, content) = editor.open_local_file(&path)?;
              Ok(TabContentResponse { metadata, content })
          }

          #[tauri::command]
          async fn update_buffer(tab_id: String, content: String, state: State<'_, AppState>) -> Result<DocumentMetadata, String> {
              let mut editor = state.editor.lock().await;
              editor.update_content(&tab_id, &content)
          }

          #[tauri::command]
          async fn save_local_file(tab_id: String, path: Option<String>, state: State<'_, AppState>) -> Result<DocumentMetadata, String> {
              let mut editor = state.editor.lock().await;
              editor.save_local_file(&tab_id, path)
          }

          #[tauri::command]
          async fn undo_action(tab_id: String, state: State<'_, AppState>) -> Result<TabContentResponse, String> {
              let mut editor = state.editor.lock().await;
              let (metadata, content) = editor.undo(&tab_id)?;
              Ok(TabContentResponse { metadata, content })
          }

          #[tauri::command]
          async fn redo_action(tab_id: String, state: State<'_, AppState>) -> Result<TabContentResponse, String> {
              let mut editor = state.editor.lock().await;
              let (metadata, content) = editor.redo(&tab_id)?;
              Ok(TabContentResponse { metadata, content })
          }

          #[tauri::command]
          async fn search_text(tab_id: String, query: String, case_sensitive: bool, use_regex: bool, state: State<'_, AppState>) -> Result<Vec<SearchMatch>, String> {
              let editor = state.editor.lock().await;
              editor.search_in_tab(&tab_id, &query, case_sensitive, use_regex)
          }

          #[tauri::command]
          async fn replace_all_text(tab_id: String, query: String, replacement: String, case_sensitive: bool, use_regex: bool, state: State<'_, AppState>) -> Result<ReplaceResponse, String> {
              let mut editor = state.editor.lock().await;
              let (metadata, content, replaced_count) = editor.replace_all_in_tab(&tab_id, &query, &replacement, case_sensitive, use_regex)?;
              Ok(ReplaceResponse { metadata, content, replaced_count })
          }

          #[tauri::command]
          async fn load_custom_font(path: String) -> Result<CustomFontData, String> {
              let file_path = Path::new(&path);
              let bytes = std::fs::read(file_path).map_err(|e| e.to_string())?;
              let ext = file_path.extension().and_then(|e| e.to_str()).unwrap_or("ttf").to_lowercase();
              let mime = match ext.as_str() { "otf" => "font/otf", "woff" => "font/woff", "woff2" => "font/woff2", _ => "font/ttf" };
              let raw_name = file_path.file_stem().and_then(|s| s.to_str()).unwrap_or("CustomFont");
              let clean: String = raw_name.chars().filter(|c| c.is_alphanumeric() || *c == '-' || *c == '_').collect();
              let font_family = if clean.is_empty() { "WEditFont".to_string() } else { clean };
              let data_url = format!("data:{};base64,{}", mime, BASE64_STANDARD.encode(&bytes));
              Ok(CustomFontData { font_family, data_url })
          }

          #[tauri::command]
          async fn gdrive_get_auth_url(state: State<'_, AppState>) -> Result<String, String> {
              let mut drive = state.gdrive.lock().await;
              Ok(drive.generate_auth_url())
          }

          #[tauri::command]
          async fn gdrive_authenticate(auth_code: String, state: State<'_, AppState>) -> Result<OAuthToken, String> {
              let mut drive = state.gdrive.lock().await;
              drive.exchange_code_for_token(&auth_code).await
          }

          #[tauri::command]
          async fn gdrive_list_files(folder_id: Option<String>, state: State<'_, AppState>) -> Result<Vec<GDriveFile>, String> {
              let drive = state.gdrive.lock().await;
              drive.list_files(folder_id.as_deref()).await
          }

          #[tauri::command]
          async fn gdrive_open_file(file_id: String, file_name: String, state: State<'_, AppState>) -> Result<TabContentResponse, String> {
              let content = { let drive = state.gdrive.lock().await; drive.download_file_content(&file_id).await? };
              let mut editor = state.editor.lock().await;
              let metadata = editor.load_from_gdrive(file_name, file_id, content.clone());
              Ok(TabContentResponse { metadata, content })
          }

          #[tauri::command]
          async fn gdrive_save_file(tab_id: String, parent_folder_id: Option<String>, state: State<'_, AppState>) -> Result<DocumentMetadata, String> {
              let (title, existing_id, content) = {
                  let editor = state.editor.lock().await;
                  let s = editor.sessions.get(&tab_id).ok_or("Not found")?;
                  (s.metadata.title.clone(), s.metadata.gdrive_file_id.clone(), s.rope.to_string())
              };
              let drive = state.gdrive.lock().await;
              let uploaded = if let Some(gid) = existing_id {
                  drive.update_existing_file(&gid, &content).await?
              } else {
                  drive.create_new_file(&title, &content, parent_folder_id.as_deref()).await?
              };
              let mut editor = state.editor.lock().await;
              let s = editor.sessions.get_mut(&tab_id).ok_or("Closed")?;
              s.metadata.gdrive_file_id = Some(uploaded.id);
              s.metadata.is_modified = false;
              Ok(s.metadata.clone())
          }

          #[cfg_attr(mobile, tauri::mobile_entry_point)]
          pub fn run() {
              let client_id = std::env::var("GOOGLE_CLIENT_ID").unwrap_or_else(|_| "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com".to_string());
              let redirect_uri = "http://localhost:8080/oauth2callback";
              tauri::Builder::default()
                  .plugin(tauri_plugin_fs::init())
                  .plugin(tauri_plugin_dialog::init())
                  .plugin(tauri_plugin_shell::init())
                  .manage(AppState {
                      editor: Mutex::new(EditorManager::new()),
                      gdrive: Mutex::new(GoogleDriveClient::new(&client_id, redirect_uri)),
                  })
                  .invoke_handler(tauri::generate_handler![
                      create_new_tab, get_all_tabs, switch_tab, close_tab, open_local_file,
                      update_buffer, save_local_file, undo_action, redo_action, search_text,
                      replace_all_text, load_custom_font, gdrive_get_auth_url, gdrive_authenticate,
                      gdrive_list_files, gdrive_open_file, gdrive_save_file
                  ])
                  .run(tauri::generate_context!())
                  .expect("Error running W edit v0.1");
          }
          EOF
          fi

      - name: 5. Cấu hình Android NDK r26d & Build-Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: 6. Cài đặt Rust & Bộ biên dịch Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: 7. Cài đặt thư viện & Tạo bộ Icon chuẩn
        run: |
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev imagemagick
          npm install
          if [ ! -f "src-tauri/icons/32x32.png" ]; then
            convert -size 1024x1024 xc:"#1e1e2e" -fill "#89b4fa" -draw "roundrectangle 180,180 844,844 120,120" app-icon.png
            npx tauri icon app-icon.png
          fi

      - name: 8. Khởi tạo khung Android & Biên dịch APK
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          fi
          npx tauri android build --apk true

      - name: 9. Ký số (Sign APK) để cài đặt trực tiếp lên điện thoại
        run: |
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk" | head -n 1)
          if [ -n "$UNSIGNED_APK" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=W Edit,O=OpenSource,C=VN"
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out W-edit-v0.1.apk "$UNSIGNED_APK"
          else
            SIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
            cp "$SIGNED_APK" W-edit-v0.1.apk
          fi

      - name: 10. Xuất file W-edit-v0.1.apk (Bản v7 chuẩn Node.js 24)
        uses: actions/upload-artifact@v7
        with:
          name: W-edit-v0.1-APK
          path: W-edit-v0.1.apk
