          use chardetng::EncodingDetector;
          use encoding_rs::Encoding;
          use regex::RegexBuilder;
          use ropey::Rope;
          use serde::{Deserialize, Serialize};
          use std::collections::HashMap;
          use std::fs::File;
          use std::io::{BufReader, BufWriter, Read, Write};
          use std::path::Path;
          use uuid::Uuid;

          #[derive(Serialize, Deserialize, Clone, Debug)]
          pub struct DocumentMetadata {
              pub id: String,
              pub title: String,
              pub file_path: Option<String>,
              pub gdrive_file_id: Option<String>,
              pub encoding: String,
              pub total_lines: usize,
              pub total_chars: usize,
              pub total_bytes: usize,
              pub is_modified: bool,
          }

          #[derive(Serialize, Deserialize, Clone, Debug)]
          pub struct SearchMatch {
              pub line: usize,
              pub start_col: usize,
              pub end_col: usize,
              pub matched_text: String,
              pub line_preview: String,
          }

          pub struct DocumentSession {
              pub metadata: DocumentMetadata,
              pub rope: Rope,
              pub undo_stack: Vec<Rope>,
              pub redo_stack: Vec<Rope>,
          }

          impl DocumentSession {
              pub fn new_empty(title: &str) -> Self {
                  let id = Uuid::new_v4().to_string();
                  Self {
                      metadata: DocumentMetadata {
                          id,
                          title: title.to_string(),
                          file_path: None,
                          gdrive_file_id: None,
                          encoding: "UTF-8".to_string(),
                          total_lines: 1,
                          total_chars: 0,
                          total_bytes: 0,
                          is_modified: false,
                      },
                      rope: Rope::new(),
                      undo_stack: Vec::new(),
                      redo_stack: Vec::new(),
                  }
              }
              pub fn refresh_stats(&mut self) {
                  self.metadata.total_lines = self.rope.len_lines();
                  self.metadata.total_chars = self.rope.len_chars();
                  self.metadata.total_bytes = self.rope.len_bytes();
              }
              pub fn push_undo(&mut self) {
                  if self.undo_stack.len() >= 100 { self.undo_stack.remove(0); }
                  self.undo_stack.push(self.rope.clone());
                  self.redo_stack.clear();
              }
          }

          pub struct EditorManager {
              pub sessions: HashMap<String, DocumentSession>,
              pub active_tab_id: Option<String>,
          }

          impl EditorManager {
              pub fn new() -> Self {
                  let mut manager = Self { sessions: HashMap::new(), active_tab_id: None };
                  let doc = DocumentSession::new_empty("Untitled-1.txt");
                  let id = doc.metadata.id.clone();
                  manager.sessions.insert(id.clone(), doc);
                  manager.active_tab_id = Some(id);
                  manager
              }
              pub fn open_local_file(&mut self, path_str: &str) -> Result<(DocumentMetadata, String), String> {
                  let path = Path::new(path_str);
                  let file = File::open(path).map_err(|e| e.to_string())?;
                  let mut reader = BufReader::new(file);
                  let mut raw_bytes = Vec::new();
                  reader.read_to_end(&mut raw_bytes).map_err(|e| e.to_string())?;
                  let mut detector = EncodingDetector::new();
                  detector.feed(&raw_bytes, true);
                  let encoding = detector.guess(None, true);
                  let (decoded, _, _) = encoding.decode(&raw_bytes);
                  let content_str = decoded.into_owned();
                  let rope = Rope::from_str(&content_str);
                  let title = path.file_name().and_then(|n| n.to_str()).unwrap_or("Unknown").to_string();
                  let id = Uuid::new_v4().to_string();
                  let mut session = DocumentSession {
                      metadata: DocumentMetadata {
                          id: id.clone(), title, file_path: Some(path_str.to_string()), gdrive_file_id: None,
                          encoding: encoding.name().to_string(), total_lines: 0, total_chars: 0, total_bytes: 0, is_modified: false,
                      },
                      rope, undo_stack: Vec::new(), redo_stack: Vec::new(),
                  };
                  session.refresh_stats();
                  let meta = session.metadata.clone();
                  self.sessions.insert(id.clone(), session);
                  self.active_tab_id = Some(id);
                  Ok((meta, content_str))
              }
              pub fn load_from_gdrive(&mut self, title: String, gdrive_id: String, content: String) -> DocumentMetadata {
                  let id = Uuid::new_v4().to_string();
                  let mut session = DocumentSession {
                      metadata: DocumentMetadata {
                          id: id.clone(), title, file_path: None, gdrive_file_id: Some(gdrive_id),
                          encoding: "UTF-8".to_string(), total_lines: 0, total_chars: 0, total_bytes: 0, is_modified: false,
                      },
                      rope: Rope::from_str(&content), undo_stack: Vec::new(), redo_stack: Vec::new(),
                  };
                  session.refresh_stats();
                  let meta = session.metadata.clone();
                  self.sessions.insert(id.clone(), session);
                  self.active_tab_id = Some(id);
                  meta
              }
              pub fn update_content(&mut self, tab_id: &str, new_content: &str) -> Result<DocumentMetadata, String> {
                  let s = self.sessions.get_mut(tab_id).ok_or("Tab not found")?;
                  s.push_undo();
                  s.rope = Rope::from_str(new_content);
                  s.metadata.is_modified = true;
                  s.refresh_stats();
                  Ok(s.metadata.clone())
              }
              pub fn save_local_file(&mut self, tab_id: &str, override_path: Option<String>) -> Result<DocumentMetadata, String> {
                  let s = self.sessions.get_mut(tab_id).ok_or("Tab not found")?;
                  if let Some(p) = override_path {
                      s.metadata.file_path = Some(p.clone());
                      if let Some(name) = Path::new(&p).file_name().and_then(|n| n.to_str()) { s.metadata.title = name.to_string(); }
                  }
                  let target = s.metadata.file_path.as_ref().ok_or("No path")?;
                  let text = s.rope.to_string();
                  let enc = Encoding::for_label(s.metadata.encoding.as_bytes()).unwrap_or(encoding_rs::UTF_8);
                  let (bytes, _, _) = enc.encode(&text);
                  let file = File::create(target).map_err(|e| e.to_string())?;
                  let mut writer = BufWriter::new(file);
                  writer.write_all(&bytes).map_err(|e| e.to_string())?;
                  writer.flush().map_err(|e| e.to_string())?;
                  s.metadata.is_modified = false;
                  s.refresh_stats();
                  Ok(s.metadata.clone())
              }
              pub fn undo(&mut self, tab_id: &str) -> Result<(DocumentMetadata, String), String> {
                  let s = self.sessions.get_mut(tab_id).ok_or("Tab not found")?;
                  if let Some(prev) = s.undo_stack.pop() {
                      s.redo_stack.push(s.rope.clone());
                      s.rope = prev;
                      s.refresh_stats();
                      Ok((s.metadata.clone(), s.rope.to_string()))
                  } else { Err("Empty undo".to_string()) }
              }
              pub fn redo(&mut self, tab_id: &str) -> Result<(DocumentMetadata, String), String> {
                  let s = self.sessions.get_mut(tab_id).ok_or("Tab not found")?;
                  if let Some(next) = s.redo_stack.pop() {
                      s.undo_stack.push(s.rope.clone());
                      s.rope = next;
                      s.refresh_stats();
                      Ok((s.metadata.clone(), s.rope.to_string()))
                  } else { Err("Empty redo".to_string()) }
              }
              pub fn search_in_tab(&self, tab_id: &str, query: &str, case_sensitive: bool, use_regex: bool) -> Result<Vec<SearchMatch>, String> {
                  if query.is_empty() { return Ok(Vec::new()); }
                  let s = self.sessions.get(tab_id).ok_or("Tab not found")?;
                  let pat = if use_regex { query.to_string() } else { regex::escape(query) };
                  let re = RegexBuilder::new(&pat).case_insensitive(!case_sensitive).build().map_err(|e| e.to_string())?;
                  let mut results = Vec::new();
                  for (idx, line) in s.rope.lines().enumerate() {
                      let l_str = line.to_string();
                      for m in re.find_iter(&l_str) {
                          results.push(SearchMatch {
                              line: idx + 1, start_col: m.start() + 1, end_col: m.end() + 1,
                              matched_text: m.as_str().to_string(), line_preview: l_str.trim_end().chars().take(100).collect(),
                          });
                          if results.len() >= 500 { return Ok(results); }
                      }
                  }
                  Ok(results)
              }
              pub fn replace_all_in_tab(&mut self, tab_id: &str, query: &str, replacement: &str, case_sensitive: bool, use_regex: bool) -> Result<(DocumentMetadata, String, usize), String> {
                  let s = self.sessions.get_mut(tab_id).ok_or("Tab not found")?;
                  let pat = if use_regex { query.to_string() } else { regex::escape(query) };
                  let re = RegexBuilder::new(&pat).case_insensitive(!case_sensitive).build().map_err(|e| e.to_string())?;
                  let text = s.rope.to_string();
                  let count = re.find_iter(&text).count();
                  if count > 0 {
                      s.push_undo();
                      let replaced = re.replace_all(&text, replacement).into_owned();
                      s.rope = Rope::from_str(&replaced);
                      s.metadata.is_modified = true;
                      s.refresh_stats();
                      Ok((s.metadata.clone(), replaced, count))
                  } else { Ok((s.metadata.clone(), text, 0)) }
              }
          }
          EOF
          fi

          if [ ! -f "src-tauri/src/gdrive.rs" ]; then
            cat << 'EOF' > src-tauri/src/gdrive.rs
          use base64::{engine::general_purpose::URL_SAFE_NO_PAD, Engine as _};
          use rand::RngCore;
          use reqwest::Client;
          use serde::{Deserialize, Serialize};
          use sha2::{Digest, Sha256};

          #[derive(Serialize, Deserialize, Clone, Debug)]
          pub struct GDriveFile {
              pub id: String,
              pub name: String,
              #[serde(rename = "mimeType")]
              pub mime_type: String,
          }

          #[derive(Deserialize)]
          struct FileListResponse { files: Vec<GDriveFile> }

          #[derive(Serialize, Deserialize, Clone, Debug)]
          pub struct OAuthToken {
              pub access_token: String,
              pub refresh_token: Option<String>,
              pub expires_in: u64,
              pub token_type: String,
          }

          pub struct GoogleDriveClient {
              http: Client,
              pub client_id: String,
              pub redirect_uri: String,
              pub code_verifier: Option<String>,
              pub token: Option<OAuthToken>,
          }

          impl GoogleDriveClient {
              pub fn new(client_id: &str, redirect_uri: &str) -> Self {
                  Self { http: Client::new(), client_id: client_id.to_string(), redirect_uri: redirect_uri.to_string(), code_verifier: None, token: None }
              }
              pub fn generate_auth_url(&mut self) -> String {
                  let mut bytes = [0u8; 32];
                  rand::thread_rng().fill_bytes(&mut bytes);
                  let verifier = URL_SAFE_NO_PAD.encode(bytes);
                  let mut hasher = Sha256::new();
                  hasher.update(verifier.as_bytes());
                  let challenge = URL_SAFE_NO_PAD.encode(hasher.finalize());
                  self.code_verifier = Some(verifier);
                  let scope = urlencoding::encode("https://www.googleapis.com/auth/drive");
                  let redirect = urlencoding::encode(&self.redirect_uri);
                  format!("https://accounts.google.com/o/oauth2/v2/auth?client_id={}&redirect_uri={}&response_type=code&scope={}&code_challenge={}&code_challenge_method=S256&access_type=offline&prompt=consent", self.client_id, redirect, scope, challenge)
              }
              pub async fn exchange_code_for_token(&mut self, auth_code: &str) -> Result<OAuthToken, String> {
                  let verifier = self.code_verifier.as_ref().ok_or("No PKCE verifier")?;
                  let params = [("client_id", self.client_id.as_str()), ("code", auth_code), ("code_verifier", verifier.as_str()), ("grant_type", "authorization_code"), ("redirect_uri", self.redirect_uri.as_str())];
                  let resp = self.http.post("https://oauth2.googleapis.com/token").form(&params).send().await.map_err(|e| e.to_string())?;
                  let token_data: OAuthToken = resp.json().await.map_err(|e| e.to_string())?;
                  self.token = Some(token_data.clone());
                  Ok(token_data)
              }
              fn bearer(&self) -> Result<&str, String> {
                  self.token.as_ref().map(|t| t.access_token.as_str()).ok_or_else(|| "Not logged in".to_string())
              }
              pub async fn list_files(&self, folder_id: Option<&str>) -> Result<Vec<GDriveFile>, String> {
                  let token = self.bearer()?;
                  let q = format!("'{}' in parents and trashed = false", folder_id.unwrap_or("root"));
                  let url = format!("https://www.googleapis.com/drive/v3/files?q={}&fields=files(id,name,mimeType)", urlencoding::encode(&q));
                  let resp = self.http.get(&url).bearer_auth(token).send().await.map_err(|e| e.to_string())?;
                  let list: FileListResponse = resp.json().await.map_err(|e| e.to_string())?;
                  Ok(list.files)
              }
              pub async fn download_file_content(&self, file_id: &str) -> Result<String, String> {
                  let token = self.bearer()?;
                  let url = format!("https://www.googleapis.com/drive/v3/files/{}?alt=media", file_id);
                  self.http.get(&url).bearer_auth(token).send().await.map_err(|e| e.to_string())?.text().await.map_err(|e| e.to_string())
              }
              pub async fn update_existing_file(&self, file_id: &str, content: &str) -> Result<GDriveFile, String> {
                  let token = self.bearer()?;
                  let url = format!("https://www.googleapis.com/upload/drive/v3/files/{}?uploadType=media&fields=id,name,mimeType", file_id);
                  self.http.patch(&url).bearer_auth(token).header("Content-Type", "text/plain; charset=utf-8").body(content.to_string()).send().await.map_err(|e| e.to_string())?.json().await.map_err(|e| e.to_string())
              }
              pub async fn create_new_file(&self, name: &str, content: &str, parent_folder_id: Option<&str>) -> Result<GDriveFile, String> {
                  let token = self.bearer()?;
                  let b = "wedit_boundary";
                  let meta = serde_json::json!({ "name": name, "mimeType": "text/plain", "parents": [parent_folder_id.unwrap_or("root")] });
                  let body = format!("--{b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n{meta}\r\n--{b}\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n{content}\r\n--{b}--");
                  let url = "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType";
                  self.http.post(url).bearer_auth(token).header("Content-Type", format!("multipart/related; boundary={}", b)).body(body).send().await.map_err(|e| e.to_string())?.json().await.map_err(|e| e.to_string())
              }
          }
          EOF
          fi

          if [ ! -f "src-tauri/src/lib.rs" ]; then
