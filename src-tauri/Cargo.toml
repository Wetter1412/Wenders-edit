[package]
# 🛠️ [KHU VỰC DỄ CHỈNH SỬA 6]: Thông tin phiên bản của lõi Rust
name = "w-edit"
version = "0.1.0"
description = "W edit v0.1 - High-performance Text & Code Editor in Rust"
authors = ["W edit Creator"]
edition = "2021"

[lib]
name = "w_edit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }

ropey = "1.6.1"
chardetng = "0.1.17"
encoding_rs = "0.8.34"
regex = "1.10.5"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2.1"
uuid = { version = "1.8", features = ["v4"] }
thiserror = "1.0"